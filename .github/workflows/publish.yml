name: Publish to crates.io

on:
  push:
    tags:
      # Accept both "v1.2.3" and "1.2.3" style version tags.
      - 'v[0-9]*'
      - '[0-9]*'
  workflow_dispatch:


permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Extract and validate version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Strip an optional leading "v" so both "v4.0.1" and "4.0.1" map
          # to the crates.io version "4.0.1".
          VERSION="${TAG#v}"

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '${TAG}' does not map to a valid SemVer version (got '${VERSION}')"
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Verify Cargo.toml version matches tag
        run: |
          MANIFEST_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          EXPECTED="${{ steps.version.outputs.version }}"

          if [ "${MANIFEST_VERSION}" != "${EXPECTED}" ]; then
            echo "::error::Cargo.toml reports version '${MANIFEST_VERSION}' but the tag '${GITHUB_REF_NAME}' wants '${EXPECTED}'."
            echo "::error::Bump the version in Cargo.toml first, commit it, then tag that commit."
            exit 1
          fi

          echo "Manifest version is ${MANIFEST_VERSION} — proceeding to publish."

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
